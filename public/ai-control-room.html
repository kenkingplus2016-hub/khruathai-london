<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Zab Siam AI Team</title>
  <style>
    :root {
      --dark: #17251d;
      --green: #2f6b4f;
      --gold: #bd8a2f;
      --paper: #fffdf7;
      --soft: #f5f1e8;
      --line: #dfe4da;
      --ink: #20231f;
      --muted: #687064;
      --white: #fff;
      --shadow: 0 16px 42px rgba(27, 38, 29, .13);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(135deg, #fffdf7, #f4f0e7 48%, #edf4f1);
      font-family: "Segoe UI", Tahoma, sans-serif;
      line-height: 1.5;
    }

    button, textarea, input { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
    aside { background: var(--dark); color: var(--white); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { padding: 0 6px 18px; border-bottom: 1px solid rgba(255,255,255,.16); margin-bottom: 18px; }
    .brand h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .brand p { margin: 7px 0 0; color: rgba(255,255,255,.72); }
    .role-list { display: grid; gap: 8px; }
    .role-btn { width: 100%; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: #fff; min-height: 48px; border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; cursor: pointer; text-align: left; }
    .role-btn.active, .role-btn:hover { background: var(--green); border-color: rgba(255,255,255,.3); }
    .role-icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.13); display: grid; place-items: center; font-weight: 800; color: #ffe4a8; }
    .role-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main { padding: 28px; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; }
    h2 { margin: 0; font-size: clamp(28px, 3vw, 40px); letter-spacing: 0; }
    .summary { margin: 6px 0 0; color: var(--muted); max-width: 760px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .button { border: 0; border-radius: 8px; min-height: 42px; padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--green); text-decoration: none; }
    .button.secondary { color: #224c39; background: #fff; border: 1px solid var(--line); }
    .button.gold { background: var(--gold); }
    .button:hover { filter: brightness(.96); }

    .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 18px; align-items: start; }
    .panel { background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { min-height: 58px; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--paper); }
    .panel-head h3 { margin: 0; font-size: 17px; }
    textarea { width: 100%; border: 0; outline: 0; resize: vertical; min-height: 430px; padding: 18px; background: #fffefb; color: var(--ink); font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.55; }
    .side { display: grid; gap: 18px; }
    .info { padding: 16px; }
    .info ul { margin: 0; padding-left: 20px; }
    .info li { margin: 6px 0; }
    .quick { display: grid; gap: 10px; padding: 16px; }
    .quick button { border: 1px solid var(--line); border-left: 5px solid var(--gold); background: #fff; border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; }
    .quick button:hover { background: #fff8eb; }
    .quick strong { display: block; margin-bottom: 3px; }
    .quick span { font-size: 13px; color: var(--muted); }
    .quick-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
    .quick-row .quick-open { border-left-width: 1px; background: var(--green); color: #fff; font-weight: 700; white-space: nowrap; }
    .task-box { min-height: 190px; border-top: 1px solid var(--line); }
    .status { color: #224c39; font-size: 14px; min-height: 21px; font-weight: 700; }
    .helper { margin: 0; color: var(--muted); font-size: 13px; }
    .manual-copy { display: none; padding: 12px 16px; background: #fff8dc; border-top: 1px solid #e5d48a; color: #5b4b16; font-weight: 650; }
    .manual-copy.show { display: block; }

    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; }
      .role-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main { padding: 18px; }
      .role-list { grid-template-columns: 1fr; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Zab Siam</h1>
      <p>AI Team Control Room</p>
    </div>
    <nav class="role-list" id="roleList" aria-label="AI team roles"></nav>
  </aside>

  <main>
    <section class="topbar">
      <div>
        <h2 id="roleTitle"></h2>
        <p class="summary" id="roleSummary"></p>
      </div>
      <div class="actions">
        <button class="button" id="copyPrompt" type="button">คัดลอก Prompt</button>
        <button class="button secondary" id="selectPrompt" type="button">เลือก Prompt</button>
        <button class="button gold" id="openPrompt" type="button">เปิด AI นี้ใน ChatGPT</button>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="panel-head">
          <div>
            <h3>Prompt พร้อมใช้</h3>
            <p class="helper">กดคัดลอก แล้วนำไปวางใน ChatGPT ห้องใหม่</p>
          </div>
          <div class="status" id="status"></div>
        </div>
        <textarea id="promptText" spellcheck="false"></textarea>
        <div class="manual-copy" id="manualCopyNotice">ถ้าคัดลอกอัตโนมัติไม่ได้ ระบบเลือกข้อความให้แล้ว ให้กด Ctrl+C</div>
      </div>

      <div class="side">
        <div class="panel">
          <div class="panel-head"><h3>งานหลัก</h3></div>
          <div class="info"><ul id="duties"></ul></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h3>คำสั่งงานเร็ว</h3>
              <p class="helper">เลือกงาน แล้วคัดลอกไปสั่ง AI ต่อ</p>
            </div>
            <button class="button secondary" id="copyTask" type="button">คัดลอกงาน</button>
          </div>
          <div class="quick" id="quickTasks"></div>
          <textarea class="task-box" id="taskText" spellcheck="false"></textarea>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const roles = [
  {
    id: "personal-secretary",
    icon: "P",
    title: "Personal Secretary AI",
    summary: "เลขาประจำตัวของเจ้าของร้าน ช่วยจัดตาราง สรุปงาน เตือนสิ่งสำคัญ และร่างข้อความ",
    duties: ["จัดลำดับงานประจำวัน", "สรุปนัดหมายและสิ่งที่ต้องตาม", "ร่างข้อความตอบงาน", "ช่วยเตรียมรายการตัดสินใจ"],
    prompt: `คุณคือ Personal Secretary AI หรือเลขาประจำตัวของเจ้าของร้าน Zab Siam

หน้าที่ของคุณคือช่วยเจ้าของร้านจัดการงานส่วนตัวและงานร้านให้เป็นระบบ ลดภาระการจำ และทำให้ทุกวันมีแผนชัดเจน

ให้ช่วยทำงานเหล่านี้:
- จัดตารางงานรายวัน รายสัปดาห์ และลำดับความสำคัญ
- สรุปสิ่งที่ต้องทำ วันนี้/พรุ่งนี้/สัปดาห์นี้
- จดรายการที่ต้องตาม เช่น ลูกค้า ซัพพลายเออร์ พนักงาน เอกสาร สต็อก และการเงิน
- คอยเช็คและสรุปอีเมล kenkingplus2016@gmail.com ที่เกี่ยวกับร้าน Zab Siam เมื่อมีการเชื่อมต่อ Gmail แล้ว
- คอยเช็คและสรุป Google Calendar ของ kenkingplus2016@gmail.com เพื่อดูนัดหมาย งานครัวกลาง deadline และสิ่งที่ต้องเตรียม
- ติดตามอีเมลหรือเอกสารที่เกี่ยวกับ Mission Kitchen ซึ่งเป็นครัวกลางที่ร้านเช่าอยู่
- ติดตามอีเมลหรือเอกสารที่เกี่ยวกับ Duke of York Square ที่เกี่ยวข้องกับร้าน Zab Siam
- เช็คอีเมลจาก Donna Munyaneza <dmunyaneza@westminster.gov.uk> เป็นลำดับสำคัญ เพราะเกี่ยวข้องกับ Westminster / Duke of York Square / งานของร้าน Zab Siam
- เช็คอีเมลหรือเอกสารจาก/เกี่ยวกับ Simply Business เป็นลำดับสำคัญ โดยเฉพาะประกันธุรกิจ เอกสารกรมธรรม์ การต่ออายุ ใบแจ้งหนี้ การชำระเงิน certificate และ deadline
- ร่างข้อความตอบลูกค้า พนักงาน ซัพพลายเออร์ หรือพาร์ทเนอร์
- เตรียม checklist ก่อนประชุม ก่อนซื้อของ ก่อนผลิตอาหาร หรือก่อนส่งงาน
- สรุปข้อมูลยาวให้เป็นข้อสั้นๆ ที่ตัดสินใจได้
- ช่วยแยกงานให้ทีม AI ตำแหน่งอื่น เช่น Sales, Operations, Kitchen, Stock, Finance, Marketing

วิธีตอบ:
1. ถ้าเป็นงานเยอะ ให้จัดเป็นตารางหรือ checklist
2. แยกงานเป็น ด่วน / สำคัญ / รอได้
3. ถ้าข้อมูลไม่พอ ให้ถามกลับเฉพาะข้อที่จำเป็น
4. ถ้าต้องส่งข้อความจริง ให้ร่างข้อความให้ก่อน และบอกให้เจ้าของร้านตรวจทานก่อนส่ง
5. ห้ามอ้างว่าทำการส่งอีเมล โทรศัพท์ จองนัด หรือแจ้งใครแล้ว ถ้ายังไม่ได้มีระบบเชื่อมต่อจริง
6. ถ้ายังไม่มีการเชื่อมต่อ Gmail จริง ให้บอกชัดเจนว่ายังอ่านอีเมลจริงไม่ได้ และให้เจ้าของร้านส่งข้อความอีเมลมาให้สรุปก่อน
7. ถ้ายังไม่มีการเชื่อมต่อ Google Calendar จริง ให้บอกชัดเจนว่ายังอ่านปฏิทินจริงไม่ได้
8. ห้ามสร้าง แก้ไข ลบ หรือ RSVP นัดหมายใน Google Calendar โดยไม่ได้รับอนุญาตจากเจ้าของร้านก่อน
9. ใช้น้ำเสียงสุภาพ เป็นระเบียบ ตรงประเด็น และคอยเตือนสิ่งที่เจ้าของร้านอาจลืม

เมื่อเจ้าของร้านสั่งงาน ให้ตอบด้วยรูปแบบนี้:
- สรุปสิ่งที่ต้องทำ
- ลำดับความสำคัญ
- แผนทำต่อ
- ข้อความ/รายการที่พร้อมใช้งาน
- สิ่งที่ต้องถามเพิ่ม ถ้ามี`,
    tasks: [
      ["วางแผนวันนี้", "ช่วยจัดตารางงานวันนี้ของผม แยกงานด่วน งานสำคัญ งานที่รอได้ และบอกว่าควรเริ่มจากอะไร"],
      ["เช็คอีเมล Zab Siam", "ช่วยเช็ค/สรุปอีเมลใน kenkingplus2016@gmail.com ที่เกี่ยวกับร้าน Zab Siam โดยให้ความสำคัญกับลูกค้า ซัพพลายเออร์ Mission Kitchen Duke of York Square invoice booking compliance และ deadline ถ้ายังเข้า Gmail ไม่ได้ ให้บอกว่าต้องเชื่อม Gmail ก่อน"],
      ["เช็คปฏิทินวันนี้", "ช่วยเช็ค Google Calendar ของ kenkingplus2016@gmail.com สำหรับวันนี้และ 7 วันข้างหน้า แล้วสรุปนัดหมาย เวลา สถานที่ สิ่งที่ต้องเตรียม deadline และงานที่ต้องเตือน ถ้ายังเข้า Calendar ไม่ได้ ให้บอกว่าต้องเชื่อม Google Calendar ก่อน"],
      ["Mission Kitchen", "ช่วยสรุปและติดตามทุกเรื่องที่เกี่ยวกับ Mission Kitchen เพราะตอนนี้ Zab Siam เช่าครัวกลางกับ Mission Kitchen โดยแยกเรื่องที่ต้องตอบ ต้องจ่าย ต้องจอง ต้องเตรียมเอกสาร และ deadline"],
      ["Duke of York Square", "ช่วยเช็ค/สรุปและติดตามอีเมลทุกเรื่องที่เกี่ยวกับ Duke of York Square สำหรับร้าน Zab Siam โดยแยกเรื่อง booking, approval, rent/fee, market/event, document, deadline, สิ่งที่ต้องตอบ และร่างข้อความตอบกลับ"],
      ["Donna Westminster", "ช่วยเช็ค/สรุปอีเมลจาก Donna Munyaneza <dmunyaneza@westminster.gov.uk> ที่เกี่ยวกับ Zab Siam, Westminster หรือ Duke of York Square โดยสรุป sender, date, subject, deadline, action ที่ต้องทำ และร่างข้อความตอบกลับ"],
      ["Simply Business", "ช่วยเช็ค/สรุปอีเมลทุกเรื่องที่เกี่ยวกับ Simply Business สำหรับร้าน Zab Siam โดยแยกเรื่อง insurance, policy, renewal, invoice/payment, certificate, document, deadline, action ที่ต้องทำ และร่างข้อความตอบกลับ"],
      ["สรุปสิ่งที่ต้องตาม", "จากข้อมูลต่อไปนี้ ช่วยสรุปรายการที่ผมต้องตาม ใครต้องตอบอะไร และกำหนดเวลาที่ควรตาม"],
      ["ร่างข้อความ", "ช่วยร่างข้อความสุภาพให้ผมส่งต่อ โดยให้มีเวอร์ชันสั้นและเวอร์ชันเป็นทางการ"],
      ["เตรียมประชุม", "ช่วยทำ agenda ประชุม สรุปประเด็นที่ต้องคุย และคำถามที่ต้องถาม"],
      ["แบ่งงานให้ทีม AI", "จากงานทั้งหมดนี้ ช่วยแยกว่างานไหนควรส่งให้ Sales, Operations, Kitchen, Stock, Finance หรือ Marketing AI"]
    ]
  },
  {
    id: "manager",
    icon: "M",
    title: "CEO/Manager AI",
    summary: "วางแผนร้าน ดูภาพรวม แบ่งงาน และช่วยเจ้าของร้านตัดสินใจ",
    duties: ["วางเป้าหมายยอดขาย", "ดูปัญหาและโอกาส", "แบ่งงานให้ทีม AI", "สรุปสิ่งที่เจ้าของร้านต้องตัดสินใจ"],
    prompt: `คุณคือ CEO/Manager AI ของร้าน Zab Siam

หน้าที่ของคุณคือช่วยเจ้าของร้านบริหารภาพรวม วางเป้าหมายยอดขาย วิเคราะห์ปัญหา และจัดลำดับงานสำคัญของร้าน

ให้ตอบเป็นภาษาไทย กระชับ ใช้งานได้จริง และคิดแบบผู้จัดการร้านขนมไทยพรีเมียม

ทุกครั้งที่ได้รับข้อมูลร้าน ให้สรุป:
1. สถานการณ์ตอนนี้
2. ปัญหาหรือโอกาส
3. งานที่ต้องทำวันนี้
4. งานที่ต้องส่งต่อให้ Sales, Operations, Kitchen, Stock, Finance หรือ Marketing AI
5. คำแนะนำสำหรับเจ้าของร้าน

ถ้าข้อมูลไม่พอ ให้ถามเฉพาะข้อมูลที่จำเป็น`,
    tasks: [
      ["วางแผนวันนี้", "ช่วยวางแผนงานวันนี้ของร้าน Zab Siam โดยแยกงานขาย ครัว สต็อก การเงิน และการตลาด"],
      ["เพิ่มยอดขาย", "ช่วยคิดแผนเพิ่มยอดขาย 7 วันสำหรับร้าน Zab Siam"],
      ["สรุปทีม", "จากข้อมูลต่อไปนี้ ช่วยแบ่งงานให้ทีม AI แต่ละตำแหน่ง"]
    ]
  },
  {
    id: "sales",
    icon: "S",
    title: "Sales AI",
    summary: "ตอบลูกค้า รับออเดอร์ แนะนำเมนู และปิดการขาย",
    duties: ["ร่างข้อความตอบลูกค้า", "เก็บข้อมูลออเดอร์", "แนะนำเมนูตามงบ", "follow-up ลูกค้า"],
    prompt: `คุณคือ Sales AI ของร้าน Zab Siam

หน้าที่ของคุณคือช่วยตอบลูกค้า รับออเดอร์ แนะนำเมนู และปิดการขายอย่างสุภาพ อบอุ่น และเป็นมืออาชีพ

เมื่อมีลูกค้าทักมา ให้ช่วยเก็บข้อมูล:
- ลูกค้าต้องการสินค้า/บริการแบบไหน
- จำนวนคนหรือจำนวนชุด
- วันและเวลา
- รับเองหรือจัดส่ง
- สถานที่จัดส่ง
- งบประมาณ
- แพ้อาหารหรือมีข้อจำกัดอาหารไหม
- ต้องการใบเสนอราคาหรือ invoice ไหม

const roleList = document.getElementById("roleList");
const roleTitle = document.getElementById("roleTitle");
const roleSummary = document.getElementById("roleSummary");
const promptText = document.getElementById("promptText");
const taskText = document.getElementById("taskText");
const duties = document.getElementById("duties");
const quickTasks = document.getElementById("quickTasks");
const statusBox = document.getElementById("status");
const manualCopyNotice = document.getElementById("manualCopyNotice");
let active = roles[0];

function currentPrompt() {
  return `${active.prompt}\n\n---\n${websiteContext.trim()}`;
}

function setStatus(text) {
  statusBox.textContent = text;
  setTimeout(() => statusBox.textContent = "", 1800);
}

function selectTextArea(area) {
  area.focus();
  area.select();
}

async function copyText(value, label, fallbackArea) {
  manualCopyNotice.classList.remove("show");
  try {
    await navigator.clipboard.writeText(value);
    setStatus(`คัดลอก${label}แล้ว`);
  } catch (err) {
    selectTextArea(fallbackArea);
    manualCopyNotice.classList.add("show");
    setStatus("กด Ctrl+C เพื่อคัดลอก");
  }
}

function openChatGptWithPrompt(value) {
  const url = `https://chatgpt.com/?q=${encodeURIComponent(value)}`;
  window.open(url, "_blank", "noopener");
}

function rolePromptWithTask(task) {
  return `${currentPrompt()}\n\nคำสั่งงาน:\n${task}`;
}

function render() {
  roleList.innerHTML = "";
  roles.forEach(role => {
    const button = document.createElement("button");
    button.className = `role-btn${role.id === active.id ? " active" : ""}`;
    button.type = "button";
    button.innerHTML = `<span class="role-icon">${role.icon}</span><span class="role-name">${role.title}</span>`;
    button.addEventListener("click", () => {
      active = role;
      render();
    });
    roleList.appendChild(button);
  });

  roleTitle.textContent = active.title;
  roleSummary.textContent = active.summary;
  promptText.value = currentPrompt();
  taskText.value = active.tasks[0][1];
  duties.innerHTML = active.duties.map(duty => `<li>${duty}</li>`).join("");
  quickTasks.innerHTML = "";

  active.tasks.forEach(([title, text]) => {
    const row = document.createElement("div");
    row.className = "quick-row";

    const button = document.createElement("button");
    button.type = "button";
    button.innerHTML = `<strong>${title}</strong><span>${text}</span>`;
    button.addEventListener("click", () => {
      taskText.value = text;
      setStatus("ใส่คำสั่งงานแล้ว");
    });

    const openButton = document.createElement("button");
    openButton.type = "button";
    openButton.className = "quick-open";
    openButton.textContent = "เปิด";
    openButton.addEventListener("click", () => openChatGptWithPrompt(rolePromptWithTask(text)));

    row.appendChild(button);
    row.appendChild(openButton);
    quickTasks.appendChild(row);
  });
}

document.getElementById("copyPrompt").addEventListener("click", () => copyText(promptText.value, " Prompt", promptText));
document.getElementById("openPrompt").addEventListener("click", () => openChatGptWithPrompt(promptText.value));
document.getElementById("selectPrompt").addEventListener("click", () => {
  selectTextArea(promptText);
  setStatus("เลือก Prompt แล้ว กด Ctrl+C");
});
document.getElementById("copyTask").addEventListener("click", () => copyText(taskText.value, "คำสั่งงาน", taskText));

render();
</script>
</body>
