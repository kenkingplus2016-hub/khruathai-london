<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Menu Generator - Zab Siam</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            color: #ff8c00;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .qr-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            page-break-inside: avoid;
        }
        .qr-card h3 {
            font-size: 1rem;
            margin: 0 0 15px 0;
            color: #111;
            min-height: 48px;
        }
        .qr-card .price {
            font-weight: 600;
            color: #ff8c00;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .qr-code {
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
        }
        .qr-url {
            font-size: 0.7rem;
            color: #888;
            word-break: break-all;
        }
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .header {
                display: none; /* Hide header when printing */
            }
            .qr-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .qr-card {
                box-shadow: none;
                border: 1px solid #ccc;
            }
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Zab Siam - QR Code Generator</h1>
        <p>Print this page (Ctrl+P or Cmd+P) to use these QR codes at your market stall.<br>Customers can scan to auto-add the item to their cart!</p>
        <button onclick="window.print()" style="padding:10px 20px; background:#ff8c00; color:#fff; border:none; border-radius:5px; cursor:pointer; font-size:1rem; font-weight:600;">Print QR Codes</button>
    </div>

    <div id="loading">Loading menu items from website...</div>
    <div class="qr-grid" id="qrGrid"></div>

    <script>
        // The base URL for the QR code links (e.g. https://zabsiam.com or https://khruathai-london.vercel.app)
        // We use window.location.origin to dynamically get the current domain
        const baseUrl = window.location.origin + '/index.html';

        async function fetchMenuItems() {
            try {
                // Fetch the main index.html to parse out all addToCart buttons
                const response = await fetch('index.html');
                const htmlText = await response.text();
                
                // Parse the HTML string into a DOM element
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Find all buttons that contain 'addToCart(' in their onclick attribute
                const buttons = doc.querySelectorAll('button[onclick*="addToCart("]');
                
                const items = [];
                const addedNames = new Set(); // To prevent duplicates
                
                buttons.forEach(btn => {
                    const onclickStr = btn.getAttribute('onclick');
                    
                    // Regex to match: addToCart('Name', 9.99, 'img/path.jpg')
                    // Handles both single and double quotes inside the function call
                    const match = onclickStr.match(/addToCart\(\s*['"](.*?)['"]\s*,\s*([\d.]+)/);
                    
                    if (match && match.length >= 3) {
                        const name = match[1];
                        const price = parseFloat(match[2]);
                        
                        // Prevent duplicate QR codes for the same item
                        if (!addedNames.has(name)) {
                            addedNames.add(name);
                            items.push({ name, price });
                        }
                    }
                });
                
                return items;
            } catch (error) {
                console.error('Error fetching menu items:', error);
                document.getElementById('loading').innerText = 'Failed to load menu items. Are you running this on a server?';
                return [];
            }
        }

        async function generateQRs() {
            const items = await fetchMenuItems();
            const grid = document.getElementById('qrGrid');
            document.getElementById('loading').style.display = 'none';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No menu items found. Make sure index.html contains addToCart() buttons.</p>';
                return;
            }

            items.forEach((item, index) => {
                const itemUrl = `${baseUrl}?add=${encodeURIComponent(item.name)}`;
                
                const card = document.createElement('div');
                card.className = 'qr-card';
                
                const title = document.createElement('h3');
                title.innerText = item.name;
                
                const price = document.createElement('div');
                price.className = 'price';
                price.innerText = `£${item.price.toFixed(2)}`;
                
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-code';
                qrContainer.id = `qrcode-${index}`;
                
                const urlText = document.createElement('div');
                urlText.className = 'qr-url';
                urlText.innerText = 'Scan to Order';
                
                card.appendChild(title);
                card.appendChild(price);
                card.appendChild(qrContainer);
                card.appendChild(urlText);
                
                grid.appendChild(card);
                
                // Generate the QR Code using qrcode.js
                new QRCode(qrContainer, {
                    text: itemUrl,
                    width: 150,
                    height: 150,
                    colorDark : "#111111",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });
        }

        // Start generation on load
        window.onload = generateQRs;
    </script>
</body>
</html>
