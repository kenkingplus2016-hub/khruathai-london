<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zab Siam AI Team</title>
<style>
 :root {
 --dark: #17251d;
 --green: #2f6b4f;
 --gold: #bd8a2f;
 --paper: #fffdf7;
 --soft: #f5f1e8;
 --line: #dfe4da;
 --ink: #20231f;
 --muted: #687064;
 --white: #fff;
 --shadow: 0 16px 42px rgba(27, 38, 29, .13);
 }

 * { box-sizing: border-box; }
 body {
 margin: 0;
 color: var(--ink);
 background: linear-gradient(135deg, #fffdf7, #f4f0e7 48%, #edf4f1);
 font-family: "Segoe UI", Tahoma, sans-serif;
 line-height: 1.5;
 }

 button, textarea, input { font: inherit; }
 .app { min-height: 100vh; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
 aside { background: var(--dark); color: var(--white); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
 .brand { padding: 0 6px 18px; border-bottom: 1px solid rgba(255,255,255,.16); margin-bottom: 18px; }
 .brand h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
 .brand p { margin: 7px 0 0; color: rgba(255,255,255,.72); }
 .role-list { display: grid; gap: 8px; }
 .role-btn { width: 100%; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: #fff; min-height: 48px; border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; cursor: pointer; text-align: left; }
 .role-btn.active, .role-btn:hover { background: var(--green); border-color: rgba(255,255,255,.3); }
 .role-icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.13); display: grid; place-items: center; font-weight: 800; color: #ffe4a8; }
 .role-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

 main { padding: 28px; }
 .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; }
 h2 { margin: 0; font-size: clamp(28px, 3vw, 40px); letter-spacing: 0; }
 .summary { margin: 6px 0 0; color: var(--muted); max-width: 760px; }
 .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
 .button { border: 0; border-radius: 8px; min-height: 42px; padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--green); text-decoration: none; }
 .button.secondary { color: #224c39; background: #fff; border: 1px solid var(--line); }
 .button.gold { background: var(--gold); }
 .button:hover { filter: brightness(.96); }

 .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 18px; align-items: start; }
 .panel { background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
 .panel-head { min-height: 58px; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--paper); }
 .panel-head h3 { margin: 0; font-size: 17px; }
 textarea { width: 100%; border: 0; outline: 0; resize: vertical; min-height: 430px; padding: 18px; background: #fffefb; color: var(--ink); font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.55; }
 .side { display: grid; gap: 18px; }
 .info { padding: 16px; }
 .info ul { margin: 0; padding-left: 20px; }
 .info li { margin: 6px 0; }
 .quick { display: grid; gap: 10px; padding: 16px; }
 .quick button { border: 1px solid var(--line); border-left: 5px solid var(--gold); background: #fff; border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; }
 .quick button:hover { background: #fff8eb; }
 .quick strong { display: block; margin-bottom: 3px; }
 .quick span { font-size: 13px; color: var(--muted); }
 .quick-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
 .quick-row .quick-open { border-left-width: 1px; background: var(--green); color: #fff; font-weight: 700; white-space: nowrap; }
 .task-box { min-height: 190px; border-top: 1px solid var(--line); }
 .status { color: #224c39; font-size: 14px; min-height: 21px; font-weight: 700; }
 .helper { margin: 0; color: var(--muted); font-size: 13px; }
 .manual-copy { display: none; padding: 12px 16px; background: #fff8dc; border-top: 1px solid #e5d48a; color: #5b4b16; font-weight: 650; }
 .manual-copy.show { display: block; }

 @media (max-width: 920px) {
 .app { grid-template-columns: 1fr; }
 aside { position: relative; height: auto; }
 .role-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
 .grid { grid-template-columns: 1fr; }
 }

 @media (max-width: 560px) {
 main { padding: 18px; }
 .role-list { grid-template-columns: 1fr; }
 .button { width: 100%; }
 }
</style>
</head>

</main>

ZAB SIAM WEBSITE CONTEXTImportant: ChatGPT opened from this control room cannot directly visit private/local systems. Use the website details below first. For the live public website, reference https://zabsiam.com only when the owner asks for public-site planning.

const roleList = document.getElementById("roleList");
const roleTitle = document.getElementById("roleTitle");
const roleSummary = document.getElementById("roleSummary");
const promptText = document.getElementById("promptText");
const taskText = document.getElementById("taskText");
const duties = document.getElementById("duties");
const quickTasks = document.getElementById("quickTasks");
const statusBox = document.getElementById("status");
const manualCopyNotice = document.getElementById("manualCopyNotice");
let active = roles[0];
function currentPrompt {
return `${active.prompt}\n\n---\n${websiteContext.trim}`;
}
function setStatus(text) {
statusBox.textContent = text;
setTimeout( => statusBox.textContent = "", 1800);
}
function selectTextArea(area) {
area.focus;
area.select;
}
async function copyText(value, label, fallbackArea) {
manualCopyNotice.classList.remove("show");
try {
 await navigator.clipboard.writeText(value);
 setStatus(` ${label} `);
} catch (err) {
 selectTextArea(fallbackArea);
 manualCopyNotice.classList.add("show");
 setStatus(" Ctrl+C");
}
}
function openChatGptWithPrompt(value) {
const url = `https://chatgpt.com/?q=${encodeURIComponent(value)}`;
window.open(url, "_blank", "noopener");
}
function rolePromptWithTask(task) {
return `${currentPrompt}\n\n :\n${task}`;
}
function render {
roleList.innerHTML = "";
roles.forEach(role => {
 const button = document.createElement("button");
 button.className = `role-btn${role.id === active.id ? " active" : ""}`;
 button.type = "button";
 button.innerHTML = `<span class="role-icon">${role.icon}</span><span class="role-name">${role.title}</span>`;
 button.addEventListener("click", => {
 active = role;
 render;
 });
 roleList.appendChild(button);
});

roleTitle.textContent = active.title;
roleSummary.textContent = active.summary;
promptText.value = currentPrompt;
taskText.value = active.tasks[0][1];
duties.innerHTML = active.duties.map(duty => `<li>${duty}</li>`).join("");
quickTasks.innerHTML = "";

active.tasks.forEach(([title, text]) => {
 const row = document.createElement("div");
 row.className = "quick-row";

 const button = document.createElement("button");
 button.type = "button";
 button.innerHTML = `<strong>${title}</strong><span>${text}</span>`;
 button.addEventListener("click", => {
 taskText.value = text;
 setStatus(" ");
 });

 const openButton = document.createElement("button");
 openButton.type = "button";
 openButton.className = "quick-open";
 openButton.textContent = " ";
 openButton.addEventListener("click", => openChatGptWithPrompt(rolePromptWithTask(text)));

 row.appendChild(button);
 row.appendChild(openButton);
 quickTasks.appendChild(row);
});
}
document.getElementById("copyPrompt").addEventListener("click", => copyText(promptText.value, " Prompt", promptText));
document.getElementById("openPrompt").addEventListener("click", => openChatGptWithPrompt(promptText.value));
document.getElementById("selectPrompt").addEventListener("click", => {
selectTextArea(promptText);
setStatus(" PromptCtrl+C");
});
document.getElementById("copyTask").addEventListener("click", => copyText(taskText.value, " ", taskText));
render;
</script>
